[package]
name = "coven-terminal-checkpoint-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
publish = false
description = "Bounded checkpoint-aware terminal stream producer and consumer draft"

[features]
default = ["coven-terminal/serde-json"]
alacritty-engine = ["coven-terminal/alacritty-engine"]

[dependencies]
coven-terminal = { package = "coven-terminal", path = "../coven-terminal", default-features = false, features = ["serde-json"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
