[package]
name = "coven-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Valentina Alexander"]
repository = "https://github.com/OpenCoven/coven"

publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
siphasher = "1"
thiserror = "2"
coven-terminal-checkpoint-transport = { path = "../coven-terminal-checkpoint-transport" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }
